  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"{{ true }}\">\n            <div style=\"display:flex; flex-direction:column; gap:16px;\">\n              <sc-for list=\"{{ selected.messages }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; justify-content:{{ m.justify }};\">\n                <div style=\"max-width:74%; background:{{ m.bubbleBg }}; border-radius:14px; padding:13px 16px;\">\n                  <div style=\"font-size:11px; font-weight:800; letter-spacing:0.5px; color:{{ m.labelColor }}; margin-bottom:5px;\">{{ m.label }}<\u002Fdiv>\n                  <div style=\"font-size:13.5px; line-height:1.55; color:{{ m.textColor }};\">{{ m.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- notes -->\n            <sc-if value=\"{{ isTabNotes }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:14px;\">\n              <div style=\"background:#FFFDF5; border:1px solid #FBEFC9; border-radius:14px; padding:16px 18px;\">\n                <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:9px;\">\n                  <span style=\"width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#E8483D,#F5836B); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px;\">AK<\u002Fspan>\n                  <span style=\"font-size:13px; font-weight:700;\">{{ selected.noteAuthor }}<\u002Fspan>\n                  <span style=\"font-size:11.5px; color:#9AA1AD;\">· {{ selected.noteTime }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:0; font-size:13.5px; color:#5A616E; line-height:1.6;\">{{ selected.noteText }}<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:10px; border:1px dashed #DDE0E5; border-radius:12px; padding:13px 16px; color:#9AA1AD; cursor:pointer;\" style-hover=\"background:#FAFBFC;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9AA1AD\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"><\u002Fline><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><\u002Fsvg>\n                <span style=\"font-size:13px; font-weight:600;\">Add a note<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- meetings -->\n            <sc-if value=\"{{ isTabMeetings }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <sc-if value=\"{{ selected.hasMeeting }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff; border:1px solid #ECEDEF; border-radius:14px; padding:18px; display:flex; align-items:center; gap:16px;\">\n                <span style=\"width:46px; height:46px; flex-shrink:0; border-radius:12px; background:#FDEBE9; display:flex; align-items:center; justify-content:center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E8483D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\u002Fline><\u002Fsvg><\u002Fspan>\n                <div style=\"flex:1; min-width:0;\"><div style=\"font-size:14.5px; font-weight:700;\">{{ selected.meetTitle }}<\u002Fdiv><div style=\"font-size:12.5px; color:#9AA1AD; margin-top:3px;\">{{ selected.meetWhen }} · {{ selected.meetVia }}<\u002Fdiv><\u002Fdiv>\n                <span style=\"font-size:11.5px; font-weight:700; color:#16A34A; background:#DCFCE7; padding:5px 11px; border-radius:8px; flex-shrink:0;\">Confirmed<\u002Fspan>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noMeeting }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"text-align:center; padding:50px 20px; color:#9AA1AD;\">\n                <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#CBD0D8\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"margin-bottom:12px;\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\u002Fline><\u002Fsvg>\n                <div style=\"font-size:13.5px; font-weight:600;\">No meeting booked yet<\u002Fdiv>\n                <div style=\"font-size:12.5px; margin-top:3px;\">The Vapi agent hasn't scheduled a meeting for this lead.<\u002Fdiv>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}\">\nclass Component extends DCLogic {\n  state = { active: 'overview', selectedId: null, detailTab: 'transcript' };\n\n  leadData() {\n    const S = {\n      won: { fg: '#16A34A', bg: '#DCFCE7', label: 'Won' },\n      qualified: { fg: '#D97706', bg: '#FEF3C7', label: 'Qualified' },\n      new: { fg: '#2563EB', bg: '#DBEAFE', label: 'New' },\n      lost: { fg: '#64748B', bg: '#F1F5F9', label: 'Lost' }\n    };\n    return [\n      { id: 'sara', name: 'Sara Hussain', initials: 'SH', avBg: '#FDEBE9', avFg: '#E8483D', email: 'sara.h@brightpk.com', phone: '+92 300 1234567', company: 'Bright Solutions', service: 'AI voice agent', budget: '$3,000 – $6,000', created: 'Jun 16, 2026', meeting: '18 Jun, 3:00 PM', meetingColor: '#5A616E', duration: '4:12', status: 'won',\n        note: { author: 'Areeba K.', time: '2 days ago', text: 'High intent — budget approved, wants 3 agent seats. Send enterprise pricing before the demo.' },\n        meet: { title: 'Demo — AI voice agent', when: '18 Jun 2026 · 3:00 PM', via: 'Google Meet · 30 min' },\n        msgs: [\n          ['agent', 'Thank you for calling MorangoAI. My name is Max. How can I help you today?'],\n          ['client', \"Hi Max, I run customer support for an e-commerce brand and we get a lot of order-status calls. Can you build an AI voice agent to handle those?\"],\n          ['agent', 'Absolutely — we build custom AI voice agents on top of Vapi, integrated with your CRM through n8n. What kind of daily call volume are you seeing?'],\n          ['client', 'Around 400 calls a day, mostly order status and returns.'],\n          ['agent', 'Perfect fit. Shall I book a live demo for your team this week?'],\n          ['client', 'Yes, Thursday at 3 PM works for us.'],\n          ['agent', \"Great — I've booked you in. You'll receive a confirmation email shortly.\"]\n        ] },\n      { id: 'bilal', name: 'Bilal Ahmed', initials: 'BA', avBg: '#EEF2FF', avFg: '#4F46E5', email: 'bilal@nexcart.io', phone: '+92 321 9876543', company: 'NexCart', service: 'Lead automation', budget: '$2,000 – $4,000', created: 'Jun 15, 2026', meeting: '19 Jun, 11:30 AM', meetingColor: '#5A616E', duration: '6:48', status: 'qualified',\n        note: { author: 'Areeba K.', time: 'Yesterday', text: 'Wants inbound leads auto-qualified and pushed to sales reps. Asked for a discovery call with agenda.' },\n        meet: { title: 'Discovery call', when: '19 Jun 2026 · 11:30 AM', via: 'Zoom · 45 min' },\n        msgs: [\n          ['agent', 'Thanks for calling MorangoAI, this is Max. What can I do for you?'],\n          ['client', 'Hey Max, we run an online marketplace and get tons of inbound leads. We want them qualified automatically before they reach our reps.'],\n          ['agent', 'We can do that — the agent qualifies on the call and n8n routes hot leads straight into your CRM. What does your team use today?'],\n          ['client', 'HubSpot, but it is mostly manual right now.'],\n          ['agent', 'Understood. Let me set up a discovery call so we can map your funnel. Does Friday morning work?'],\n          ['client', 'Friday 11:30 is good.']\n        ] },\n      { id: 'fatima', name: 'Fatima Malik', initials: 'FM', avBg: '#ECFEFF', avFg: '#0891B2', email: 'f.malik@zaytun.co', phone: '+92 333 5551212', company: 'Zaytun Foods', service: 'Customer support bot', budget: '$1,000 – $2,000', created: 'Jun 15, 2026', meeting: '—', meetingColor: '#9AA1AD', duration: '2:05', status: 'new',\n        note: { author: 'Areeba K.', time: 'Yesterday', text: 'Early stage — exploring options. Requested a callback next week and a brochure.' },\n        meet: null,\n        msgs: [\n          ['agent', 'Hello, you have reached MorangoAI — this is Max. How can I help?'],\n          ['client', 'Hi, I want to know if you can build a support bot for our food delivery line.'],\n          ['agent', 'Yes — voice or chat, handling FAQs, order tracking and complaints. What channels do your customers use most?'],\n          ['client', 'Mostly phone calls. I am still comparing options though.'],\n          ['agent', \"No problem — I'll email you a brochure and follow up next week.\"]\n        ] },\n      { id: 'hamza', name: 'Hamza Raza', initials: 'HR', avBg: '#F0FDF4', avFg: '#16A34A', email: 'hamza@finloop.app', phone: '+92 345 7778899', company: 'FinLoop', service: 'Appointment booking', budget: '$2,500 – $5,000', created: 'Jun 14, 2026', meeting: '20 Jun, 2:00 PM', meetingColor: '#5A616E', duration: '5:30', status: 'qualified',\n        note: { author: 'Areeba K.', time: '2 days ago', text: 'Fintech advisory firm — needs the agent to book advisor appointments straight into Google Calendar.' },\n        meet: { title: 'Appointment booking setup', when: '20 Jun 2026 · 2:00 PM', via: 'Google Meet · 30 min' },\n        msgs: [\n          ['agent', 'MorangoAI, this is Max speaking. How can I help today?'],\n          ['client', 'We are a financial advisory firm and want an agent that books client appointments on our advisors calendars.'],\n          ['agent', 'We integrate directly with Google Calendar and confirm via email through n8n. How many advisors?'],\n          ['client', 'Six advisors for now.'],\n          ['agent', \"Let's get you a setup call to configure availability. Does the 20th at 2 PM work?\"],\n          ['client', 'That works, thanks.']\n        ] },\n      { id: 'usman', name: 'Usman Khan', initials: 'UK', avBg: '#F1F5F9', avFg: '#64748B', email: 'usman@dealpoint.pk', phone: '+92 301 2223344', company: 'DealPoint', service: 'Outbound calling', budget: 'Not disclosed', created: 'Jun 13, 2026', meeting: '—', meetingColor: '#9AA1AD', duration: '1:18', status: 'lost',\n        note: { author: 'Areeba K.', time: '3 days ago', text: 'No budget allocated this quarter. Revisit in Q4.' },\n        meet: null,\n        msgs: [\n          ['agent', 'Thanks for calling MorangoAI, this is Max. How can I help?'],\n          ['client', 'I wanted pricing on outbound calling agents.'],\n          ['agent', 'Sure — pricing depends on volume and scripts. Do you have a budget range in mind?'],\n          ['client', \"Honestly we have no budget this quarter, just researching.\"],\n          ['agent', \"No problem — I'll keep your details and reach out next quarter.\"]\n        ] },\n      { id: 'ayesha', name: 'Ayesha Nadeem', initials: 'AN', avBg: '#FDEBE9', avFg: '#E8483D', email: 'ayesha@medixcare.pk', phone: '+92 312 4445566', company: 'MedixCare', service: 'Patient reminders', budget: '$4,000 – $8,000', created: 'Jun 12, 2026', meeting: '21 Jun, 10:00 AM', meetingColor: '#5A616E', duration: '3:44', status: 'won',\n        note: { author: 'Areeba K.', time: 'Yesterday', text: 'Clinic group — wants automated patient reminder calls + rescheduling. Signed off on onboarding.' },\n        meet: { title: 'Onboarding — patient reminders', when: '21 Jun 2026 · 10:00 AM', via: 'Google Meet · 60 min' },\n        msgs: [\n          ['agent', 'MorangoAI, this is Max. How can I help you today?'],\n          ['client', 'We run a clinic group and miss a lot of appointments. Can your agent call patients with reminders?'],\n          ['agent', 'Yes — reminder calls, confirmations and rescheduling, all logged to your system. How many clinics?'],\n          ['client', 'Four clinics, about 600 appointments a week.'],\n          ['agent', \"Let's onboard you. I'll book a 60-minute setup call for the 21st at 10 AM.\"],\n          ['client', 'Perfect, we are excited to start.']\n        ] },\n      { id: 'talha', name: 'Talha Iqbal', initials: 'TI', avBg: '#EEF2FF', avFg: '#4F46E5', email: 'talha@swiftlog.co', phone: '+92 308 6667788', company: 'SwiftLog', service: 'Sales qualification', budget: '$1,500 – $3,000', created: 'Jun 11, 2026', meeting: '—', meetingColor: '#9AA1AD', duration: '2:52', status: 'new',\n        note: { author: 'Areeba K.', time: '4 days ago', text: 'Logistics SaaS — wants inbound demo requests qualified before reaching AEs. Reviewing internally.' },\n        meet: null,\n        msgs: [\n          ['agent', 'Thank you for calling MorangoAI, this is Max. How can I help?'],\n          ['client', 'We get a lot of demo requests and want them pre-qualified before our AEs jump on.'],\n          ['agent', 'We can score and route them automatically. What is your current demo request volume?'],\n          ['client', 'Roughly 80 a week. I need to discuss internally first.'],\n          ['agent', \"Of course — I'll send over a one-pager and follow up.\"]\n        ] }\n    ];\n  }\n\n  renderVals() {\n    const a = this.state.active;\n    const go = (id) => () => this.setState({ active: id });\n    const ids = ['overview','leads','meetings','calls','pipeline','analytics','email'];\n    const mk = (id) => a === id\n      ? { bg: '#FDEBE9', fg: '#C9372C', ic: '#E8483D' }\n      : { bg: 'transparent', fg: '#5A616E', ic: '#9AA1AD' };\n    const nav = {};\n    ids.forEach(id => { nav[id] = mk(id); });\n    const titles = { overview: 'Overview', leads: 'Leads', meetings: 'Meetings', calls: 'Call Logs', pipeline: 'Pipeline', analytics: 'Analytics', email: 'Email Activity' };\n    const subs = {\n      overview: 'Live performance across calls, meetings and pipeline',\n      leads: 'All contacts captured from Vapi calls',\n      meetings: 'Upcoming and recent booked meetings',\n      calls: 'Recordings, transcripts and AI summaries',\n      pipeline: 'Drag-stage view of every active deal',\n      analytics: 'Trends across calls, conversion and outreach',\n      email: 'Follow-up emails sent via n8n automation'\n    };\n    const S = {\n      won: { fg: '#16A34A', bg: '#DCFCE7', label: 'Won' },\n      qualified: { fg: '#D97706', bg: '#FEF3C7', label: 'Qualified' },\n      new: { fg: '#2563EB', bg: '#DBEAFE', label: 'New' },\n      lost: { fg: '#64748B', bg: '#F1F5F9', label: 'Lost' }\n    };\n    const raw = this.leadData();\n    const leads = raw.map(l => ({\n      ...l,\n      statusFg: S[l.status].fg, statusBg: S[l.status].bg, statusLabel: S[l.status].label,\n      open: () => this.setState({ selectedId: l.id, detailTab: 'transcript' })\n    }));\n\n    const sel = raw.find(l => l.id === this.state.selectedId) || null;\n    let selected = null;\n    if (sel) {\n      const msgs = sel.msgs.map(([role, text]) => role === 'agent'\n        ? { label: 'AGENT', labelColor: '#E8483D', bubbleBg: '#F4F5F7', textColor: '#3A4150', justify: 'flex-start' }\n        : { label: 'CLIENT', labelColor: '#16191D', bubbleBg: '#FDEBE9', textColor: '#16191D', justify: 'flex-end' });\n      msgs.forEach((m, i) => { m.text = sel.msgs[i][1]; });\n      selected = {\n        ...sel,\n        statusFg: S[sel.status].fg, statusBg: S[sel.status].bg, statusLabel: S[sel.status].label,\n        messages: msgs,\n        hasMeeting: !!sel.meet,\n        meetTitle: sel.meet ? sel.meet.title : '',\n        meetWhen: sel.meet ? sel.meet.when : '',\n        meetVia: sel.meet ? sel.meet.via : '',\n        noteAuthor: sel.note.author, noteTime: sel.note.time, noteText: sel.note.text\n      };\n    }\n\n    const dt = this.state.detailTab;\n    const tab = (id) => dt === id\n      ? { fg: '#16191D', border: '#E8483D', weight: '700' }\n      : { fg: '#9AA1AD', border: 'transparent', weight: '600' };\n\n    return {\n      isOverview: a === 'overview', isLeads: a === 'leads', isMeetings: a === 'meetings',\n      isCalls: a === 'calls', isPipeline: a === 'pipeline', isAnalytics: a === 'analytics', isEmail: a === 'email',\n      nav,\n      goOverview: go('overview'), goLeads: go('leads'), goMeetings: go('meetings'),\n      goCalls: go('calls'), goPipeline: go('pipeline'), goAnalytics: go('analytics'), goEmail: go('email'),\n      pageTitle: titles[a], pageSub: subs[a],\n      leads,\n      selected, showDetail: !!selected,\n      noMeeting: selected ? !selected.hasMeeting : false,\n      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },\n      closeLead: () => this.setState({ selectedId: null }),\n      tabTranscript: () => this.setState({ detailTab: 'transcript' }),\n      tabNotes: () => this.setState({ detailTab: 'notes' }),\n      tabMeetings: () => this.setState({ detailTab: 'meetings' }),\n      isTabTranscript: dt === 'transcript', isTabNotes: dt === 'notes', isTabMeetings: dt === 'meetings',\n      tTranscript: tab('transcript'), tNotes: tab('notes'), tMeetings: tab('meetings')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
